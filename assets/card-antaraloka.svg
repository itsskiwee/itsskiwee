<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" role="img" aria-label="antaraloka">
<style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1s step-end infinite}
.s0{opacity:0;animation:pop 7s 0.6s infinite}.s1{opacity:0;animation:pop 7s 1.5s infinite}.s2{opacity:0;animation:pop 7s 2.4s infinite}@keyframes pop{0%{opacity:0}4%,88%{opacity:1}100%{opacity:0}}@keyframes fill{0%{width:0}70%,100%{width:376px}}.bar{animation:fill 7s ease-out infinite}
</style>
<defs>
<clipPath id="win"><rect width="420" height="250" rx="12"/></clipPath>
<filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#win)">
<rect width="420" height="250" fill="#0a0e14"/>
<text x="22" y="32" fill="#8b949e" font-size="12">~/work</text>
<text x="22" y="60" fill="#39ff14" font-size="22" font-weight="800" filter="url(#glow)">antaraloka</text>
<text x="22" y="86" fill="#c9d1d9" font-size="13">platform · currently building</text>
<text class="s0" x="22" y="136" fill="#39ff14" font-size="13">[ok] init platform</text><text class="s1" x="22" y="156" fill="#39ff14" font-size="13">[ok] wire up services</text><text class="s2" x="22" y="176" fill="#ffbd2e" font-size="13">[..] shipping features</text><rect x="22" y="200" width="376" height="6" rx="3" fill="#161b22"/><rect class="bar" x="22" y="200" width="0" height="6" rx="3" fill="#39ff14" filter="url(#glow)"/>
<text x="22" y="232" fill="#8b949e" font-size="12"><tspan class="blink">●</tspan> in progress</text>
</g>
<rect x=".5" y=".5" width="419" height="249" rx="12" fill="none" stroke="#30363d"/>
</svg>
